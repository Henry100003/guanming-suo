name = "guanming-chat"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
# Comma-separated list of site origins allowed to call the API.
ALLOWED_ORIGINS = "https://henry100003.github.io"
# Cheapest tier first; change to a larger model for paid users later.
MODEL = "claude-haiku-5-5"

# Per-IP limit: 8 requests / 60 seconds.
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "1001"
simple = { limit = 8, period = 60 }

# Secret (not stored in this file):  npx wrangler secret put ANTHROPIC_API_KEY
